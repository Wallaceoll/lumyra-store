<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta Relojoaria — Lumyra</title>
  <meta name="description" content="Explore a precisão e o luxo dos relógios Lumyra. Peças exclusivas para quem valoriza cada segundo.">
  <link rel="stylesheet" href="../assets/css/lumyra.css">
</head>
<body>

<!-- ─── PAGE HERO ──────────────────────────────────────────── -->
<section class="page-hero">
  <div>
    <div class="eyebrow" style="margin-bottom:20px">Precisão & Maestria</div>
    <h1>Alta<br><em>Relojoaria</em></h1>
  </div>
  <div class="page-hero-meta">
    <p>
      Onde a engenharia encontra a arte. Nossa seleção de relógios combina movimentos precisos com acabamentos em metais nobres.
    </p>
    <div class="product-count">Exibindo <span id="countNum">...</span> relógios</div>
  </div>
</section>

<!-- ─── FILTER BAR ──────────────────────────────────────────── -->
<div class="filter-bar">
  <div class="sub-filters" id="subFilters">
    <a href="relogios.html" class="sub-filter-btn active">Todos</a>
    <a href="relogios.html?genero=feminino" class="sub-filter-btn">Femininos</a>
    <a href="relogios.html?genero=masculino" class="sub-filter-btn">Masculinos</a>
    <a href="relogios.html?filter=conjunto" class="sub-filter-btn" style="border-color: var(--gold); color: var(--gold)">Conjuntos</a>
    <a href="relogios.html?filter=oferta" class="sub-filter-btn">Ofertas</a>
  </div>

  <div class="filter-sort">
    <label for="sortSelect">Ordenar</label>
    <select id="sortSelect">
      <option value="default">Destaques</option>
      <option value="price-asc">Menor preço</option>
      <option value="price-desc">Maior preço</option>
    </select>
  </div>
</div>

<!-- ─── CATALOG GRID ────────────────────────────────────────── -->
<section class="catalog-section">
  <div class="catalog-grid" id="catalogGrid"></div>
</section>

<script src="../js/services/ProductService.js"></script>
<script src="../js/services/CartService.js"></script>
<script src="../js/main.js"></script>
<script src="../js/components/Header.js"></script>
<script src="../js/components/Footer.js"></script>

<script>
  (async function initRelogios() {
    const params = Router.getParams();
    let _allProducts = [];
    let _activeSub = params.genero || params.movimento || null;
    let _sortOrder = 'default';

    try {
      const all = await ProductService.fetchAll();
      _allProducts = all.filter(p => p.cat === 'relogios');
      renderCatalog();
      document.getElementById('sortSelect').addEventListener('change', (e) => {
        _sortOrder = e.target.value;
        renderCatalog();
      });
    } catch (err) { console.error(err); }

    function renderCatalog() {
      let products = [..._allProducts];
      const f = params.filter;

      if (_activeSub) {
        products = products.filter(p => p.name.toLowerCase().includes(_activeSub) || p.description.toLowerCase().includes(_activeSub));
      }

      if (f === 'conjunto') products = products.filter(p => p.isSet);
      if (f === 'oferta')   products = products.filter(p => p.oldPrice);
      if (_sortOrder === 'price-asc') products.sort((a, b) => a.price - b.price);
      if (_sortOrder === 'price-desc') products.sort((a, b) => b.price - a.price);

      document.getElementById('countNum').textContent = products.length;
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = products.map(p => {
        const off = p.oldPrice ? Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100) : 0;
        return `
          <article class="product-card reveal" data-hover>
            <a href="produto.html?id=${p.id}" aria-label="Ver ${p.name}">
              <div class="product-img-wrap">
                ${p.isSet ? '<span class="badge-set">Conjunto</span>' : ''}
                ${off > 0 ? `<span class="badge-off">-${off}%</span>` : ''}
                <img src="${p.img}" alt="${p.name}" loading="lazy">
              </div>
              <div class="product-info">
                <div>
                  <div class="product-cat">${p.catLabel}</div>
                  <div class="product-name">${p.name}</div>
                  <div class="product-detail">${p.detail || p.description?.substring(0, 40) + '...'}</div>
                </div>
                <div class="product-price">
                   ${p.oldPrice ? `<span style="text-decoration:line-through;font-size:14px;color:var(--warm-gray);display:block">R$ ${p.oldPrice.toLocaleString('pt-BR')}</span>` : ''}
                   ${CartService.formatCurrency(p.price)}
                </div>
              </div>
            </a>
            <button class="add-to-cart"
                    onclick="event.preventDefault();
                             CartService.add({id:'${p.id}',name:'${p.name}',price:${p.price},cat:'${p.catLabel}',img:'${p.img}'});
                             Toast.show('${p.name} adicionado');">
              Adicionar ao carrinho
            </button>
          </article>
        `;
      }).join('');
    }
  })();
</script>

</body>
</html>
