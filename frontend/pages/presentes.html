<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia de Presentes — Lumyra</title>
  <meta name="description" content="Encontre o presente perfeito. Sugestões curadas para momentos inesquecíveis.">
  <link rel="stylesheet" href="../assets/css/shared.css">
  <link rel="stylesheet" href="../assets/css/catalog.css">
</head>
<body>

<!-- ─── PAGE HERO ──────────────────────────────────────────── -->
<section class="page-hero">
  <div>
    <div class="eyebrow" style="margin-bottom:20px">Para Momentos Especiais</div>
    <h1>Guia de<br><em>Presentes</em></h1>
  </div>
  <div class="page-hero-meta">
    <p>
      Surpreenda quem você ama com uma joia que carrega significado. Filtre por faixa de preço e encontre a peça ideal.
    </p>
    <div class="product-count">Exibindo <span id="countNum">...</span> sugestões</div>
  </div>
</section>

<!-- ─── FILTER BAR ──────────────────────────────────────────── -->
<div class="filter-bar">
  <div class="sub-filters" id="subFilters">
    <button class="sub-filter-btn active" data-filter="todos">Todos</button>
    <button class="sub-filter-btn" data-filter="ate-3000">Até R$ 3.000</button>
    <button class="sub-filter-btn" data-filter="3000-10000">R$ 3.000 - R$ 10.000</button>
    <button class="sub-filter-btn" data-filter="acima-10000">Acima de R$ 10.000</button>
  </div>

  <div class="filter-sort">
    <label for="sortSelect">Ordenar</label>
    <select id="sortSelect">
      <option value="default">Destaques</option>
      <option value="price-asc">Menor preço</option>
      <option value="price-desc">Maior preço</option>
    </select>
  </div>
</div>

<!-- ─── CATALOG GRID ────────────────────────────────────────── -->
<section class="catalog-section">
  <div class="catalog-grid" id="catalogGrid"></div>
</section>

<script src="../js/services/ProductService.js"></script>
<script src="../js/services/CartService.js"></script>
<script src="../js/main.js"></script>
<script src="../js/components/Header.js"></script>


<script>
  (async function initPresentes() {
    let _allProducts = [];
    let _activePrice = null;
    let _sortOrder = 'default';

    try {
      const all = await ProductService.fetchAll();
      _allProducts = all.filter(p => p.cat === 'presentes' || p.featured);
      renderCatalog();

      // Filter buttons
      document.querySelectorAll('.sub-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.sub-filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const filter = btn.dataset.filter;
          _activePrice = (filter === 'todos') ? null : filter;
          renderCatalog();
        });
      });

      document.getElementById('sortSelect').addEventListener('change', (e) => {
        _sortOrder = e.target.value;
        renderCatalog();
      });
    } catch (err) { console.error(err); }

    function renderCatalog() {
      let products = [..._allProducts];
      if (_activePrice) {
        if (_activePrice === 'ate-3000') products = products.filter(p => p.price <= 3000);
        else if (_activePrice === '3000-10000') products = products.filter(p => p.price > 3000 && p.price <= 10000);
        else if (_activePrice === 'acima-10000') products = products.filter(p => p.price > 10000);
      }
      if (_sortOrder === 'price-asc') products.sort((a, b) => a.price - b.price);
      if (_sortOrder === 'price-desc') products.sort((a, b) => b.price - a.price);

      document.getElementById('countNum').textContent = products.length;
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = products.map(p => {
        const off = p.oldPrice ? Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100) : 0;
        return `
          <article class="product-card reveal" data-hover>
            <a href="produto.html?id=${p.id}" aria-label="Ver ${p.name}">
              <div class="product-img-wrap">
                <span class="badge-set" style="background: var(--gold); color: white;">Sugestão</span>
                ${off > 0 ? `<span class="badge-off">-${off}%</span>` : ''}
                <img src="${p.img}" alt="${p.name}" loading="lazy">
              </div>
              <div class="product-info">
                <div>
                  <div class="product-cat">${p.type || p.catLabel}</div>
                  <div class="product-name">${p.name}</div>
                  <div class="product-detail">${p.detail || p.description.substring(0, 60) + '...'}</div>
                </div>
                <div class="product-price">
                   ${p.oldPrice ? `<span style="text-decoration:line-through;font-size:14px;color:var(--warm-gray);display:block">R$ ${p.oldPrice.toLocaleString('pt-BR')}</span>` : ''}
                   ${CartService.formatCurrency(p.price)}
                </div>
              </div>
            </a>
            <div class="product-actions" style="display: flex; gap: 8px; padding: 0 20px 20px;">
              <a href="produto.html?id=${p.id}" class="btn-outline" style="flex: 1; padding: 12px; font-size: 11px; text-align: center;">Detalhes</a>
              <button class="btn-primary" style="flex: 1; padding: 12px; font-size: 11px;"
                      onclick="event.preventDefault();
                               CartService.add({id:'${p.id}',name:'${p.name}',price:${p.price},cat:'${p.catLabel}',img:'${p.img}'});
                               Toast.show('${p.name} adicionado');">
                + Carrinho
              </button>
            </div>
          </article>
        `;
      }).join('');

      // Re-observa para animações reveal
      grid.querySelectorAll('.reveal:not(.visible)').forEach(el => {
        new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.08 }).observe(el);
      });
    }
  })();
</script>

</body>
</html>
