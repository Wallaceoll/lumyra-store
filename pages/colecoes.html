<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coleções — Lumyra</title>
  <meta name="description" content="Explore a coleção completa de joias, alianças e relógios Lumyra.">
  <link rel="stylesheet" href="../assets/css/lumyra.css">
  <script src="https://js.stripe.com/v3/" async></script>


</head>
<body>

<!-- ─── PAGE HERO ──────────────────────────────────────────── -->
<section class="page-hero">
  <div>
    <div class="eyebrow" style="margin-bottom:20px">Lumyra — Catálogo</div>
    <h1>Nossa<br><em>Coleção</em></h1>
  </div>
  <div class="page-hero-meta">
    <p>
      Joias, alianças e relógios criados para atravessar
      o tempo. Cada peça, um objeto com intenção.
    </p>
    <div class="product-count" id="productCount">
      <span id="countNum">—</span> peças disponíveis
    </div>
  </div>
</section>

<!-- ─── FILTER BAR ──────────────────────────────────────────── -->
<div class="filter-bar" role="navigation" aria-label="Filtros de categoria">
  <ul class="filter-tabs" role="tablist">
    <li class="filter-tab active" role="tab" data-cat="todas" tabindex="0">Todas</li>
    <li class="filter-tab" role="tab" data-cat="joias"    tabindex="0">Joias</li>
    <li class="filter-tab" role="tab" data-cat="aliancas" tabindex="0">Alianças</li>
    <li class="filter-tab" role="tab" data-cat="relogios" tabindex="0">Relógios</li>
  </ul>

  <div class="filter-sort">
    <label for="sortSelect">Ordenar</label>
    <select id="sortSelect">
      <option value="default">Destaques</option>
      <option value="price-asc">Menor preço</option>
      <option value="price-desc">Maior preço</option>
      <option value="name">Nome A–Z</option>
    </select>
  </div>
</div>

<!-- ─── CATALOG GRID ────────────────────────────────────────── -->
<section class="catalog-section">
  <div class="catalog-grid" id="catalogGrid" role="list" aria-label="Lista de produtos">
    <!-- Skeleton inicial -->
    ${Array.from({length:6}).map(() => `
      <div class="skeleton-card">
        <div class="skeleton skeleton-img"></div>
        <div class="skeleton skeleton-line" style="width:45%"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line short"></div>
        <div style="height:24px"></div>
      </div>`).join('')}
  </div>
</section>

<!-- ─── FOOTER ──────────────────────────────────────────────── -->
<div id="footer-mount"></div>

<!-- ─── SCRIPTS ─────────────────────────────────────────────── -->
<script src="../js/services/CartService.js"></script>
<script src="../js/services/ProductService.js"></script>
<script src="../js/services/StripeService.js"></script>
<script src="../js/components/Header.js"></script>
<script src="../js/main.js"></script>

<script>
  /* ── Estado da página ─────────────────────────────────── */
  let _allProducts   = [];
  let _activeCategory = 'todas';
  let _sortOrder      = 'default';

  /* ── Inicialização ────────────────────────────────────── */
  (async function initColecoes() {
    // Lê categoria da URL (ex: ?categoria=aliancas)
    const params = Router.getParams();
    if (params.categoria) {
      _activeCategory = params.categoria;
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.cat === _activeCategory);
      });
    }

    try {
      _allProducts = await ProductService.fetchAll();
      renderCatalog();
    } catch (err) {
      document.getElementById('catalogGrid').innerHTML =
        `<div class="catalog-empty">
           <div class="catalog-empty-title">Erro ao carregar</div>
           <div class="catalog-empty-sub">Recarregue a página para tentar novamente.</div>
         </div>`;
      console.error('[Colecoes] initColecoes:', err);
    }

    // Bind filtros
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        _activeCategory = tab.dataset.cat;
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderCatalog();
      });
      // Acessibilidade: Enter / Space ativa o tab
      tab.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tab.click(); }
      });
    });

    document.getElementById('sortSelect').addEventListener('change', e => {
      _sortOrder = e.target.value;
      renderCatalog();
    });
  })();

  /* ── Render ───────────────────────────────────────────── */
  function renderCatalog() {
    const grid = document.getElementById('catalogGrid');

    // 1. Filtra
    let products = _activeCategory === 'todas'
      ? [..._allProducts]
      : _allProducts.filter(p => p.cat === _activeCategory);

    // 2. Ordena
    if (_sortOrder === 'price-asc')  products.sort((a, b) => a.price - b.price);
    if (_sortOrder === 'price-desc') products.sort((a, b) => b.price - a.price);
    if (_sortOrder === 'name')       products.sort((a, b) => a.name.localeCompare(b.name));

    // 3. Atualiza contador
    document.getElementById('countNum').textContent = products.length;

    // 4. Vazio
    if (products.length === 0) {
      grid.innerHTML = `
        <div class="catalog-empty">
          <div class="catalog-empty-title">Nenhuma peça encontrada</div>
          <div class="catalog-empty-sub">Tente outra categoria.</div>
        </div>`;
      return;
    }

    // 5. Renderiza cards
    grid.innerHTML = products.map((p, i) => `
      <article class="catalog-card reveal${i > 0 ? ' reveal-delay-' + Math.min(i % 3, 3) : ''}"
               role="listitem" data-hover>
        <a href="produto.html?id=${p.id}" aria-label="Ver detalhes de ${p.name}">
          <div class="catalog-img-wrap">
            <span class="catalog-badge">${p.catLabel}</span>
            <img src="${p.img}" alt="${p.name}" loading="lazy">
          </div>
        </a>
        <div class="catalog-info">
          <div class="catalog-cat">${p.catLabel}</div>
          <div class="catalog-name">${p.name}</div>
          <div class="catalog-detail">${p.detail}</div>
          <div class="catalog-footer">
            <div class="catalog-price">${CartService.formatCurrency(p.price)}</div>
            <div class="catalog-actions">
              <a class="btn-detail" href="produto.html?id=${p.id}">Detalhes</a>
              <button class="btn-add"
                      onclick="CartService.add({id:'${p.id}',name:'${p.name}',price:${p.price},cat:'${p.catLabel}',img:'${p.img}'});
                               Toast.show('${p.name} adicionado');"
                      aria-label="Adicionar ${p.name} ao carrinho">
                + Carrinho
              </button>
            </div>
          </div>
        </div>
      </article>
    `).join('');

    // Re-observa para animações reveal
    grid.querySelectorAll('.reveal:not(.visible)').forEach(el => {
      new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.08 }).observe(el);
    });
  }
</script>

</body>
</html>
