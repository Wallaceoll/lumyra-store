<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido Confirmado — Lumyra</title>
  <link rel="stylesheet" href="../assets/css/lumyra.css">


</head>
<body>

<!-- Confetti container -->
<div class="confetti-container" id="confettiContainer" aria-hidden="true"></div>

<main class="success-page">
  <div class="success-bg" aria-hidden="true"></div>

  <div class="success-content">

    <!-- Ícone check -->
    <div class="success-icon-wrap" aria-hidden="true">
      <div class="success-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
    </div>

    <!-- Badge do pedido -->
    <div class="order-id-badge">
      Pedido <strong id="orderIdDisplay">#LMR-000000</strong>
    </div>

    <!-- Título -->
    <h1 class="success-title">
      Pedido<br><em>confirmado.</em>
    </h1>

    <!-- Subtítulo -->
    <p class="success-sub" id="successSubtext">
      Seu pedido foi recebido e está sendo preparado.<br>
      Você receberá um e-mail de confirmação em breve<br>
      com os detalhes e o código de rastreamento.
    </p>

    <!-- Timeline de status -->
    <div class="order-timeline" role="list" aria-label="Status do pedido">
      <div class="timeline-step done" role="listitem">
        <div class="timeline-dot">✓</div>
        <div class="timeline-label">Confirmado</div>
      </div>
      <div class="timeline-step active" role="listitem">
        <div class="timeline-dot">◎</div>
        <div class="timeline-label">Preparando</div>
      </div>
      <div class="timeline-step" role="listitem">
        <div class="timeline-dot">→</div>
        <div class="timeline-label">Enviado</div>
      </div>
      <div class="timeline-step" role="listitem">
        <div class="timeline-dot">⌂</div>
        <div class="timeline-label">Entregue</div>
      </div>
    </div>

    <!-- CTAs -->
    <div class="success-ctas">
      <a href="colecoes.html" class="btn-primary">
        Continuar comprando
        <svg width="16" height="10" viewBox="0 0 20 12" fill="none" aria-hidden="true">
          <path d="M0 6h18M13 1l6 5-6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a href="../index.html" class="btn-outline">
        Voltar ao início
      </a>
    </div>

    <!-- Detalhes colapsáveis -->
    <div class="order-details">
      <div class="order-details-toggle" onclick="toggleDetails()" data-hover
           role="button" tabindex="0" aria-expanded="false" aria-controls="detailsBody">
        <span>Detalhes do pedido</span>
        <span class="toggle-icon" id="toggleIcon">+</span>
      </div>
      <div class="order-details-body" id="detailsBody" role="region">
        <div id="orderDetailRows"></div>
      </div>
    </div>

  </div>
</main>

<!-- Footer -->
<div id="footer-mount"></div>

<!-- Scripts -->
<script src="../js/services/CartService.js"></script>
<script src="../js/services/ProductService.js"></script>
<script src="../js/services/StripeService.js"></script>
<script src="../js/components/Header.js"></script>
<script src="../js/main.js"></script>

<script>
  /* ── Lê dados da sessão ─────────────────────────────── */
  const orderId    = sessionStorage.getItem('lumyra_order_id')    || `LMR-${Date.now()}`;
  const orderEmail = sessionStorage.getItem('lumyra_order_email') || 'seu e-mail';

  /* ── Exibe ID do pedido ─────────────────────────────── */
  document.getElementById('orderIdDisplay').textContent = `#${orderId}`;

  /* ── Subtítulo personalizado ────────────────────────── */
  document.getElementById('successSubtext').innerHTML = `
    Seu pedido foi recebido e está sendo preparado.<br>
    Você receberá a confirmação em <strong>${orderEmail}</strong><br>
    com os detalhes e o código de rastreamento.
  `;

  /* ── Detalhes do pedido ─────────────────────────────── */
  function renderOrderDetails() {
    const now      = new Date();
    const rows     = document.getElementById('orderDetailRows');

    const estimated = new Date(now);
    estimated.setDate(estimated.getDate() + 7);
    const dateStr = estimated.toLocaleDateString('pt-BR', {
      day: 'numeric', month: 'long', year: 'numeric'
    });

    rows.innerHTML = `
      <div class="detail-row">
        <span class="key">Número do pedido</span>
        <span>#${orderId}</span>
      </div>
      <div class="detail-row">
        <span class="key">Data</span>
        <span>${now.toLocaleDateString('pt-BR')}</span>
      </div>
      <div class="detail-row">
        <span class="key">Entrega estimada</span>
        <span>${dateStr}</span>
      </div>
      <div class="detail-row">
        <span class="key">Confirmação enviada para</span>
        <span>${orderEmail}</span>
      </div>
      <div class="detail-row">
        <span class="key">Frete</span>
        <span style="color:var(--gold)">Grátis</span>
      </div>
      <div class="detail-row" style="margin-top:8px;padding-top:12px;border-top:1px solid var(--bone)">
        <span class="key">Status</span>
        <span style="color:var(--gold);font-size:11px;letter-spacing:0.2em;text-transform:uppercase">
          Em preparação
        </span>
      </div>
    `;
  }
  renderOrderDetails();

  /* ── Toggle detalhes ────────────────────────────────── */
  function toggleDetails() {
    const body   = document.getElementById('detailsBody');
    const icon   = document.getElementById('toggleIcon');
    const toggle = document.querySelector('.order-details-toggle');
    const open   = body.classList.toggle('open');
    icon.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', open);
  }

  /* ── Confetti ───────────────────────────────────────── */
  (function spawnConfetti() {
    const container = document.getElementById('confettiContainer');
    const colors    = ['#B8963E', '#D4AF70', '#F0E8D0', '#0E0D0B', '#8A8278'];
    const count     = 40;

    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';

      const size     = Math.random() * 8 + 4;
      const isSquare = Math.random() > 0.5;

      el.style.cssText = `
        left: ${Math.random() * 100}%;
        width: ${size}px;
        height: ${size}px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        border-radius: ${isSquare ? '0' : '50%'};
        animation-duration: ${Math.random() * 2 + 2}s;
        animation-delay: ${Math.random() * 1.5}s;
      `;

      container.appendChild(el);
    }

    // Remove confetti após animação
    setTimeout(() => container.remove(), 5000);
  })();

  /* ── Limpa sessionStorage após leitura ─────────────── */
  sessionStorage.removeItem('lumyra_order_id');
  sessionStorage.removeItem('lumyra_order_email');
</script>

</body>
</html>
