<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido Confirmado — Lumyra</title>
  <link rel="stylesheet" href="../assets/css/lumyra.css">

  <style>
    /* ── LAYOUT ─────────────────────────────────────────── */
    .success-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 64px 80px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Fundo decorativo */
    .success-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, var(--gold-pale) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .success-content {
      position: relative;
      z-index: 1;
      max-width: 560px;
    }

    /* Ícone animado */
    .success-icon-wrap {
      width: 80px; height: 80px;
      margin: 0 auto 40px;
      position: relative;
    }
    .success-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      opacity: 0;
    }
    .success-circle svg {
      width: 28px; height: 28px;
      color: var(--gold);
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawCheck 0.4s ease 0.5s forwards;
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    /* Nº do pedido */
    .order-id-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--bone);
      padding: 10px 24px;
      margin-bottom: 32px;
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--warm-gray);
    }
    .order-id-badge strong {
      color: var(--ink);
      letter-spacing: 0.15em;
    }

    .success-title {
      font-family: var(--font-display);
      font-size: clamp(48px, 7vw, 80px);
      font-weight: 300;
      line-height: 0.95;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s ease 0.2s forwards;
    }
    .success-title em { font-style: italic; color: var(--gold); }

    .success-sub {
      font-size: 14px;
      color: var(--warm-gray);
      line-height: 1.85;
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s ease 0.35s forwards;
    }
    .success-sub strong { color: var(--ink); }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Timeline de status */
    .order-timeline {
      display: flex;
      align-items: flex-start;
      gap: 0;
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.5s forwards;
    }
    .timeline-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .timeline-step::after {
      content: '';
      position: absolute;
      top: 15px; left: 50%;
      width: 100%; height: 1px;
      background: var(--bone);
      z-index: 0;
    }
    .timeline-step:last-child::after { display: none; }

    .timeline-dot {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--bone);
      background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      z-index: 1;
      position: relative;
    }
    .timeline-step.done .timeline-dot {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--cream);
    }
    .timeline-step.active .timeline-dot {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--ink);
    }
    .timeline-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--warm-gray);
      text-align: center;
    }
    .timeline-step.done .timeline-label,
    .timeline-step.active .timeline-label { color: var(--ink); }

    /* CTAs */
    .success-ctas {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.65s forwards;
    }

    /* Detalhes do pedido (colapsável) */
    .order-details {
      margin-top: 64px;
      width: 100%;
      max-width: 560px;
      text-align: left;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.8s forwards;
    }
    .order-details-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-top: 1px solid var(--bone);
      border-bottom: 1px solid var(--bone);
      cursor: none;
      user-select: none;
    }
    .order-details-toggle span {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--warm-gray);
    }
    .toggle-icon {
      color: var(--gold);
      font-size: 18px;
      transition: transform 0.3s;
    }
    .toggle-icon.open { transform: rotate(45deg); }

    .order-details-body {
      display: none;
      padding: 24px 0;
      border-bottom: 1px solid var(--bone);
    }
    .order-details-body.open { display: block; }

    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 7px 0;
      color: var(--charcoal);
    }
    .detail-row .key { color: var(--warm-gray); }

    /* Confetti particles */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      width: 6px; height: 6px;
      opacity: 0;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { opacity: 1; transform: translateY(-20px) rotate(0deg); }
      100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
    }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 768px) {
      .success-page { padding: 110px 32px 60px; }
      .order-timeline { gap: 0; }
      .timeline-label { font-size: 9px; }
    }
    @media (max-width: 480px) {
      .success-page  { padding: 100px 24px 48px; }
      .success-ctas  { flex-direction: column; align-items: stretch; }
      .success-ctas a { text-align: center; }
      .order-timeline { display: none; } /* simplifica em mobile muito pequeno */
    }
  </style>
</head>
<body>

<!-- Confetti container -->
<div class="confetti-container" id="confettiContainer" aria-hidden="true"></div>

<main class="success-page">
  <div class="success-bg" aria-hidden="true"></div>

  <div class="success-content">

    <!-- Ícone check -->
    <div class="success-icon-wrap" aria-hidden="true">
      <div class="success-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
    </div>

    <!-- Badge do pedido -->
    <div class="order-id-badge">
      Pedido <strong id="orderIdDisplay">#LMR-000000</strong>
    </div>

    <!-- Título -->
    <h1 class="success-title">
      Pedido<br><em>confirmado.</em>
    </h1>

    <!-- Subtítulo -->
    <p class="success-sub" id="successSubtext">
      Seu pedido foi recebido e está sendo preparado.<br>
      Você receberá um e-mail de confirmação em breve<br>
      com os detalhes e o código de rastreamento.
    </p>

    <!-- Timeline de status -->
    <div class="order-timeline" role="list" aria-label="Status do pedido">
      <div class="timeline-step done" role="listitem">
        <div class="timeline-dot">✓</div>
        <div class="timeline-label">Confirmado</div>
      </div>
      <div class="timeline-step active" role="listitem">
        <div class="timeline-dot">◎</div>
        <div class="timeline-label">Preparando</div>
      </div>
      <div class="timeline-step" role="listitem">
        <div class="timeline-dot">→</div>
        <div class="timeline-label">Enviado</div>
      </div>
      <div class="timeline-step" role="listitem">
        <div class="timeline-dot">⌂</div>
        <div class="timeline-label">Entregue</div>
      </div>
    </div>

    <!-- CTAs -->
    <div class="success-ctas">
      <a href="colecoes.html" class="btn-primary">
        Continuar comprando
        <svg width="16" height="10" viewBox="0 0 20 12" fill="none" aria-hidden="true">
          <path d="M0 6h18M13 1l6 5-6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a href="../index.html" class="btn-outline">
        Voltar ao início
      </a>
    </div>

    <!-- Detalhes colapsáveis -->
    <div class="order-details">
      <div class="order-details-toggle" onclick="toggleDetails()" data-hover
           role="button" tabindex="0" aria-expanded="false" aria-controls="detailsBody">
        <span>Detalhes do pedido</span>
        <span class="toggle-icon" id="toggleIcon">+</span>
      </div>
      <div class="order-details-body" id="detailsBody" role="region">
        <div id="orderDetailRows"></div>
      </div>
    </div>

  </div>
</main>

<!-- Footer -->
<div id="footer-mount"></div>

<!-- Scripts -->
<script src="../js/services/CartService.js"></script>
<script src="../js/services/ProductService.js"></script>
<script src="../js/services/StripeService.js"></script>
<script src="../js/components/Header.js"></script>
<script src="../js/main.js"></script>

<script>
  /* ── Lê dados da sessão ─────────────────────────────── */
  const orderId    = sessionStorage.getItem('lumyra_order_id')    || `LMR-${Date.now()}`;
  const orderEmail = sessionStorage.getItem('lumyra_order_email') || 'seu e-mail';

  /* ── Exibe ID do pedido ─────────────────────────────── */
  document.getElementById('orderIdDisplay').textContent = `#${orderId}`;

  /* ── Subtítulo personalizado ────────────────────────── */
  document.getElementById('successSubtext').innerHTML = `
    Seu pedido foi recebido e está sendo preparado.<br>
    Você receberá a confirmação em <strong>${orderEmail}</strong><br>
    com os detalhes e o código de rastreamento.
  `;

  /* ── Detalhes do pedido ─────────────────────────────── */
  function renderOrderDetails() {
    const now      = new Date();
    const rows     = document.getElementById('orderDetailRows');

    const estimated = new Date(now);
    estimated.setDate(estimated.getDate() + 7);
    const dateStr = estimated.toLocaleDateString('pt-BR', {
      day: 'numeric', month: 'long', year: 'numeric'
    });

    rows.innerHTML = `
      <div class="detail-row">
        <span class="key">Número do pedido</span>
        <span>#${orderId}</span>
      </div>
      <div class="detail-row">
        <span class="key">Data</span>
        <span>${now.toLocaleDateString('pt-BR')}</span>
      </div>
      <div class="detail-row">
        <span class="key">Entrega estimada</span>
        <span>${dateStr}</span>
      </div>
      <div class="detail-row">
        <span class="key">Confirmação enviada para</span>
        <span>${orderEmail}</span>
      </div>
      <div class="detail-row">
        <span class="key">Frete</span>
        <span style="color:var(--gold)">Grátis</span>
      </div>
      <div class="detail-row" style="margin-top:8px;padding-top:12px;border-top:1px solid var(--bone)">
        <span class="key">Status</span>
        <span style="color:var(--gold);font-size:11px;letter-spacing:0.2em;text-transform:uppercase">
          Em preparação
        </span>
      </div>
    `;
  }
  renderOrderDetails();

  /* ── Toggle detalhes ────────────────────────────────── */
  function toggleDetails() {
    const body   = document.getElementById('detailsBody');
    const icon   = document.getElementById('toggleIcon');
    const toggle = document.querySelector('.order-details-toggle');
    const open   = body.classList.toggle('open');
    icon.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', open);
  }

  /* ── Confetti ───────────────────────────────────────── */
  (function spawnConfetti() {
    const container = document.getElementById('confettiContainer');
    const colors    = ['#B8963E', '#D4AF70', '#F0E8D0', '#0E0D0B', '#8A8278'];
    const count     = 40;

    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';

      const size     = Math.random() * 8 + 4;
      const isSquare = Math.random() > 0.5;

      el.style.cssText = `
        left: ${Math.random() * 100}%;
        width: ${size}px;
        height: ${size}px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        border-radius: ${isSquare ? '0' : '50%'};
        animation-duration: ${Math.random() * 2 + 2}s;
        animation-delay: ${Math.random() * 1.5}s;
      `;

      container.appendChild(el);
    }

    // Remove confetti após animação
    setTimeout(() => container.remove(), 5000);
  })();

  /* ── Limpa sessionStorage após leitura ─────────────── */
  sessionStorage.removeItem('lumyra_order_id');
  sessionStorage.removeItem('lumyra_order_email');
</script>

</body>
</html>
