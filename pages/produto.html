<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto — Lumyra</title>
  <link rel="stylesheet" href="../assets/css/lumyra.css">
  <script src="https://js.stripe.com/v3/" async></script>


</head>
<body>

<!-- Breadcrumb -->
<nav class="breadcrumb" aria-label="Navegação estrutural">
  <a href="../index.html">Home</a>
  <span class="breadcrumb-sep" aria-hidden="true">—</span>
  <a href="colecoes.html">Coleções</a>
  <span class="breadcrumb-sep" aria-hidden="true">—</span>
  <span id="breadcrumbName" aria-current="page">Produto</span>
</nav>

<!-- Product Layout -->
<main class="product-layout" id="productLayout" aria-label="Detalhes do produto">
  <div style="grid-column:span 2;padding:80px;text-align:center;color:var(--warm-gray);font-size:12px;letter-spacing:0.2em;text-transform:uppercase">
    Carregando…
  </div>
</main>

<!-- Related Products -->
<section class="related-section" id="relatedSection" style="display:none">
  <div class="related-header reveal">
    <div>
      <div class="section-label">Você também pode gostar</div>
      <h2 class="section-title" style="font-family:var(--font-display);font-weight:300">Outras Peças</h2>
    </div>
    <a href="colecoes.html" class="view-all" style="font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:var(--warm-gray);border-bottom:1px solid var(--bone);padding-bottom:4px;transition:color 0.25s,border-color 0.25s">
      Ver todas
    </a>
  </div>
  <div class="related-grid" id="relatedGrid"></div>
</section>

<!-- Footer -->
<div id="footer-mount"></div>

<!-- Scripts -->
<script src="../js/services/CartService.js"></script>
<script src="../js/services/ProductService.js"></script>
<script src="../js/services/StripeService.js"></script>
<script src="../js/components/Header.js"></script>
<script src="../js/main.js"></script>

<script>
  /* ── Estado ─────────────────────────────────────────── */
  let _product     = null;
  let _selectedSize = null;

  /* ── Init ───────────────────────────────────────────── */
  (async function initProduto() {
    const { id } = Router.getParams();

    if (!id) {
      Router.go('colecoes.html');
      return;
    }

    try {
      _product = await ProductService.fetchById(id);
      renderProduct(_product);
      renderRelated(_product);
      document.title = `${_product.name} — Lumyra`;
      document.getElementById('breadcrumbName').textContent = _product.name;
    } catch (err) {
      document.getElementById('productLayout').innerHTML =
        `<div style="grid-column:span 2;padding:80px;text-align:center">
           <p style="font-family:var(--font-display);font-size:36px;color:var(--warm-gray);font-weight:300">
             Produto não encontrado
           </p>
           <a href="colecoes.html" style="font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold)">
             ← Voltar à coleção
           </a>
         </div>`;
      console.error('[Produto] initProduto:', err);
    }
  })();

  /* ── Render produto ──────────────────────────────────── */
  function renderProduct(p) {
    const layout = document.getElementById('productLayout');

    const installment = Math.round(p.price / 12);
    const isRing  = p.cat === 'joias' || p.cat === 'aliancas';
    const sizes   = isRing ? [10,12,14,16,18,20,22,24] : [];

    layout.innerHTML = `
      <!-- GALERIA -->
      <div class="product-gallery" data-hover>
        <div class="gallery-main" id="galleryMain">
          <img src="${p.img}" alt="${p.name}" id="mainImg" loading="eager">
        </div>
        <div class="gallery-thumbs">
          ${[p.img, p.img, p.img].map((img, i) => `
            <div class="gallery-thumb ${i === 0 ? 'active' : ''}"
                 onclick="switchThumb(this, '${img}')" data-hover>
              <img src="${img}" alt="${p.name} — vista ${i+1}" loading="lazy">
            </div>`).join('')}
        </div>
      </div>

      <!-- INFO -->
      <div class="product-info-panel">
        <div class="product-info-cat">${p.catLabel}</div>
        <h1 class="product-info-name">${p.name}</h1>
        <p class="product-info-detail">${p.detail}</p>

        <div class="product-info-price">${CartService.formatCurrency(p.price)}</div>
        <div class="product-info-installment">
          ou <strong>12× de ${CartService.formatCurrency(installment)}</strong> sem juros
        </div>

        <div class="info-divider"></div>

        <p class="product-description">${p.description}</p>

        <div class="materials-title">Materiais</div>
        <ul class="materials-list">
          ${p.materials.map(m => `<li>${m}</li>`).join('')}
        </ul>

        ${sizes.length > 0 ? `
        <div class="size-selector">
          <div class="size-label">Tamanho <span id="selectedSizeLabel" style="color:var(--gold)"></span></div>
          <div class="size-options">
            ${sizes.map(s => `
              <button class="size-btn" data-size="${s}"
                      onclick="selectSize(this, ${s})"
                      aria-label="Tamanho ${s}">
                ${s}
              </button>`).join('')}
          </div>
        </div>` : ''}

        <div class="product-ctas">
          <button class="cta-buy" onclick="buyNow()" aria-label="Comprar agora">
            Comprar agora
            <svg width="18" height="11" viewBox="0 0 20 12" fill="none" aria-hidden="true">
              <path d="M0 6h18M13 1l6 5-6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="cta-cart" onclick="addCurrentToCart()" aria-label="Adicionar ao carrinho">
            + Adicionar ao carrinho
          </button>
        </div>

        <div class="trust-badges">
          <div class="trust-item">
            <strong>Frete Grátis</strong>
            <span>Para todo o Brasil · Seguro incluso</span>
          </div>
          <div class="trust-item">
            <strong>Certificado</strong>
            <span>Laudo de autenticidade incluso</span>
          </div>
          <div class="trust-item">
            <strong>Garantia</strong>
            <span>Vitalícia em defeito de fabricação</span>
          </div>
        </div>
      </div>
    `;
  }

  /* ── Galeria: troca imagem principal ─────────────────── */
  function switchThumb(thumbEl, imgSrc) {
    document.getElementById('mainImg').src = imgSrc;
    document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
    thumbEl.classList.add('active');
  }

  /* ── Seleção de tamanho ──────────────────────────────── */
  function selectSize(btn, size) {
    _selectedSize = size;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const label = document.getElementById('selectedSizeLabel');
    if (label) label.textContent = `— ${size}`;
  }

  /* ── Ações de compra ─────────────────────────────────── */
  function addCurrentToCart() {
    if (!_product) return;
    CartService.add({
      id:    _product.id,
      name:  _product.name,
      price: _product.price,
      cat:   _product.catLabel,
      img:   _product.img,
    });
    Toast.show(`${_product.name} adicionado`);
    Header.toggleCart();
  }

  function buyNow() {
    if (!_product) return;
    CartService.add({
      id:    _product.id,
      name:  _product.name,
      price: _product.price,
      cat:   _product.catLabel,
      img:   _product.img,
    });
    Router.go('checkout.html');
  }

  /* ── Produtos relacionados ───────────────────────────── */
  async function renderRelated(current) {
    try {
      const all      = await ProductService.fetchAll();
      const related  = all
        .filter(p => p.id !== current.id && p.cat === current.cat)
        .slice(0, 3);

      if (related.length === 0) return;

      document.getElementById('relatedSection').style.display = 'block';
      document.getElementById('relatedGrid').innerHTML = related.map(p => `
        <article class="related-card reveal" data-hover>
          <a href="produto.html?id=${p.id}" aria-label="Ver ${p.name}">
            <div class="related-img-wrap">
              <img src="${p.img}" alt="${p.name}" loading="lazy">
            </div>
          </a>
          <div class="related-info">
            <div class="related-cat">${p.catLabel}</div>
            <div class="related-name">${p.name}</div>
            <div class="related-price">${CartService.formatCurrency(p.price)}</div>
          </div>
          <button class="related-add"
                  onclick="CartService.add({id:'${p.id}',name:'${p.name}',price:${p.price},cat:'${p.catLabel}',img:'${p.img}'});
                           Toast.show('${p.name} adicionado');"
                  aria-label="Adicionar ${p.name} ao carrinho">
            + Carrinho
          </button>
        </article>
      `).join('');

      document.querySelectorAll('#relatedGrid .reveal').forEach(el => {
        new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1 }).observe(el);
      });
    } catch (err) {
      console.warn('[Produto] renderRelated:', err);
    }
  }
</script>

</body>
</html>
